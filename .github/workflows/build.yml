name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
    build-installer:
        runs-on: ubuntu-latest
        steps:
          - name: Install devscripts, debhelper and build-essential
            run: sudo apt-get update && sudo apt-get install -y devscripts debhelper build-essential

          - name: Checkout sources
            uses: actions/checkout@v4
            with:
                fetch-depth: 0

          - name: Fetch tags explicitly
            run: git fetch origin +refs/tags/*:refs/tags/*

          - name: Build RPM
            shell: bash
            run: |
                ./build_rpm.sh

          - name: Build DEB
            shell: bash
            run: |
                ./build_deb.sh

          - name: Upload artifacts
            if: github.ref_type != 'tag'
            uses: actions/upload-artifact@v4
            with:
              name: packages
              path: |
                  *.deb
                  *.rpm
              if-no-files-found: error

          - name: Publish release
            if: github.ref_type == 'tag'
            uses: softprops/action-gh-release@v2
            with:
              files: |
                  *.deb
                  *.rpm
              generate_release_notes: true

